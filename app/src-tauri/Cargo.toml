[package]
name = "context-garden-app"
version = "0.4.0"
description = "ContextGarden desktop app: gardens of repos, skills and agent terminals"
authors = ["Oliver Weißl"]
license = "MIT"
edition = "2021"

[lib]
name = "cg_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
strip = true
