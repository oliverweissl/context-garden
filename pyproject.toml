[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "context-garden"
version = "0.1.0"
description = "Context Garden trims the weeds from your agent's context so the important information can thrive."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Context Garden contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/context-garden/context-garden"
Issues = "https://github.com/context-garden/context-garden/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/context_garden"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
