[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "context-garden"
version = "0.2.0"
description = "Self-contained Agent Skills that cut an agent's context usage."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Oliver Weißl" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/context-garden/context-garden"
Issues = "https://github.com/context-garden/context-garden/issues"

[tool.hatch.build.targets.wheel]
# No library code to ship -- this project is dev tooling (pytest/ruff config
# + the `dev` extra) plus benchmarks/ and skills/, neither of which is a
# Python package. Metadata-only wheel.
bypass-selection = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Skills are self-contained, independently authored code (see docs/architecture.md,
# "Skill self-containment") and keep their own style; the monorepo lint config
# does not reach into them.
extend-exclude = ["skills"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
