name: App · macOS

# Desktop app on macOS; its status is the macOS badge in the README.
on:
  pull_request:
    paths: ["app/**", ".github/workflows/app-*.yml"]
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app-*.yml"]

jobs:
  app:
    uses: ./.github/workflows/app-checks.yml
    with:
      os: macos-latest
