name: App · Ubuntu

# Desktop app on Ubuntu; its status is the Ubuntu badge in the README.
on:
  pull_request:
    paths: ["app/**", ".github/workflows/app-*.yml"]
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app-*.yml"]

jobs:
  app:
    uses: ./.github/workflows/app-checks.yml
    with:
      os: ubuntu-22.04
