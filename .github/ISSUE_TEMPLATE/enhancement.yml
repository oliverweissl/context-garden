name: Enhancement
description: Suggest an improvement to an existing feature
title: "[Enhancement]: "
labels: ["enhancement"]
body:
  - type: input
    id: area
    attributes:
      label: Existing feature
      description: Which existing feature, skill or part of the app should be improved?
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current behavior
      description: How does it work today?
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: Proposed improvement
      description: What should change, and why?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
